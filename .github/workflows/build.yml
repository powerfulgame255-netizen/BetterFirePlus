name: Build BetterFire+
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
 
      - name: Make gradlew executable
        run: chmod +x ./BetterFirePlus/gradlew
 
      - name: Build mod
        working-directory: ./BetterFirePlus
        run: ./gradlew build
 
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterFirePlus-JAR
          path: BetterFirePlus/build/libs/*.jar
 
