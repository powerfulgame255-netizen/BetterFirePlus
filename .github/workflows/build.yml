name: Build BetterFire+
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
 
     - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4
          with:
            gradle-version: '8.8'
      - name: Build mod
        working-directory: ./BetterFirePlus
        run: gradle build
 
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterFirePlus-JAR
          path: BetterFirePlus/build/libs/*.jar
 
